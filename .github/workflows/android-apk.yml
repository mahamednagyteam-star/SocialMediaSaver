name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source and upstream projects
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm diagnostic build configuration
        run: echo "Building diagnostic debug APK with minification and resource shrinking disabled."
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload compact ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: media-saver-arm64-v8a-compact
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
